<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <script src="https://kit.fontawesome.com/ba40759956.js" crossorigin="anonymous"></script>
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Advice generator app</title>
  <link rel="stylesheet" href="style.css">

</head>
<body>

  <main class="container">
    <span class="quote_no">Advice <p id="quote_id"></p></span>
    <p id="quote"></p>

    <picture>
      <source srcset="./images/pattern-divider-mobile.svg" media="(max-width: 600px)">
      <source srcset="./images/pattern-divider-desktop.svg" media="(max-width: 1200px)">
      <img src="./images/pattern-divider-desktop.svg" alt="Responsive Image">
    </picture>

    <button id="btn"><img id="btn-image" src="./images/icon-dice.svg" alt="icon-dice"></button>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="https://www.linkedin.com/in/eyu-birhanu/">Eyu Birhanu</a>.
  </footer>
  <script src="./main.js"></script>
</body>
</html>
